name: Build APK, GitHub Release & F-Droid Repo

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag da versão para criar Release (ex: v1.3.3)'
        required: false
        default: 'v1.3.3'
      purge_old_apks:
        description: 'Limpar APKs antigos do histórico F-Droid e manter apenas esta versão'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  release-and-fdroid:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restaurar cache de keystore de debug estável (fallback sem secrets)
        uses: actions/cache@v4
        with:
          path: .ci-debug-keystore
          key: aojarvis-debug-keystore-v1
          restore-keys: |
            aojarvis-debug-keystore-

      - name: Restaurar cache da chave de assinatura do repositório F-Droid
        uses: actions/cache@v4
        with:
          path: .fdroid-repo-keystore
          key: fdroid-repo-keystore-aojarvis-v2
          restore-keys: |
            fdroid-repo-keystore-aojarvis-

      - name: Preparar keystore e compilar APK
        id: build_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          # Aceita licenças do Android SDK para permitir download automático do compileSdk
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

          # Restaura app/google-services.json via secret (JSON puro ou Base64) caso não esteja versionado
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              echo "app/google-services.json restaurado a partir do secret GOOGLE_SERVICES_JSON."
            elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\n\r ' | base64 -d > app/google-services.json
              echo "app/google-services.json restaurado a partir do secret GOOGLE_SERVICES_JSON_BASE64."
            else
              echo "::warning::app/google-services.json ausente no repositório e secrets GOOGLE_SERVICES_JSON / GOOGLE_SERVICES_JSON_BASE64 não definidos. O APK será compilado com suporte a importação em runtime do google-services.json."
            fi
          else
            echo "app/google-services.json encontrado no repositório."
          fi

          GRADLE_CI_FLAGS=(
            --no-daemon
            --no-configuration-cache
            --stacktrace
            "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          )

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Compilando APK de Release assinado..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/my-upload-key.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/my-upload-key.jks"
            gradle :app:assembleRelease "${GRADLE_CI_FLAGS[@]}"
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            echo "build_type=release" >> "$GITHUB_OUTPUT"
          else
            echo "Secrets de Release não configurados; compilando APK debug com chave estável..."
            if [ ! -f debug.keystore ]; then
              if [ -f debug.keystore.base64 ]; then
                base64 -d debug.keystore.base64 > debug.keystore
              elif [ -f .ci-debug-keystore/debug.keystore ]; then
                cp .ci-debug-keystore/debug.keystore debug.keystore
              else
                mkdir -p .ci-debug-keystore
                keytool -genkeypair -v -noprompt \
                  -keystore .ci-debug-keystore/debug.keystore \
                  -storepass android \
                  -alias androiddebugkey \
                  -keypass android \
                  -keyalg RSA \
                  -keysize 2048 \
                  -validity 10000 \
                  -dname "CN=A.O.Jarvis Debug,O=A.O.Jarvis,C=BR"
                cp .ci-debug-keystore/debug.keystore debug.keystore
              fi
            fi
            gradle :app:assembleDebug "${GRADLE_CI_FLAGS[@]}"
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Erro: APK não encontrado após o build."
            exit 1
          fi

          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/[^0-9]//g')
          VERSION_NAME="${VERSION_NAME:-1.3.3}"
          VERSION_CODE="${VERSION_CODE:-7}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v${VERSION_NAME}"
          fi

          CLEAN_TAG="${TAG_NAME#v}"
          FINAL_APK="A.O.Jarvis-${CLEAN_TAG}.apk"
          cp "$APK_PATH" "$FINAL_APK"
          echo "apk_file=$FINAL_APK" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Publicar GitHub Release com APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build_apk.outputs.tag_name }}
          name: "A.O.Jarvis ${{ steps.build_apk.outputs.tag_name }}"
          make_latest: true
          generate_release_notes: true
          files: |
            ${{ steps.build_apk.outputs.apk_file }}

      - name: Gerar repositório estático F-Droid válido e íntegro
        id: build_fdroid
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEY_PASS }}
          APK_FILE: ${{ steps.build_apk.outputs.apk_file }}
          APP_VERSION_NAME: ${{ steps.build_apk.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.build_apk.outputs.version_code }}
          PURGE_OLD_APKS: ${{ github.event.inputs.purge_old_apks || 'false' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fdroidserver apksigner aapt python3

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          REPO_OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO_OWNER_LOWER=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          REPO_NAME="${GITHUB_REPOSITORY##*/}"

          RAW_REPO_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/fdroid/repo"
          PAGES_REPO_URL="https://${REPO_OWNER_LOWER}.github.io/${REPO_NAME}/fdroid/repo"

          APP_ID=$(grep -E 'applicationId\s*=' "$GITHUB_WORKSPACE/app/build.gradle.kts" | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$APP_ID" ]; then
            echo "Erro fatal: applicationId não encontrado em app/build.gradle.kts"
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/fdroid-site"
          mkdir -p "$GITHUB_WORKSPACE/fdroid-site/fdroid/repo" "$GITHUB_WORKSPACE/fdroid-site/fdroid/metadata"
          cd "$GITHUB_WORKSPACE/fdroid-site/fdroid"

          # Clona branch gh-pages anterior apenas para preservar histórico limpo de APKs compatíveis
          mkdir -p existing-apks
          if [ "$PURGE_OLD_APKS" != "true" ] && git ls-remote --exit-code --heads "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" existing-pages
            if [ -d existing-pages/fdroid/repo ]; then
              cp -n existing-pages/fdroid/repo/*.apk existing-apks/ 2>/dev/null || true
            fi
            rm -rf existing-pages
          fi

          # Sanitização estrita em Python:
          # - Remove APKs com nome antigo ("OpenJarvis") ou rótulo diferente de "A.O.Jarvis"
          # - Remove APKs assinados com certificado diferente do APK atual (evita erro de instalação/upgrade)
          # - Deduplica qualquer versionCode repetido (elimina versões 1.0 duplicadas)
          # - Usa nome content-addressed com SHA-256 curto (elimina "IOException: Hash not matching" por cache de CDN)
          python3 - "$GITHUB_WORKSPACE/$APK_FILE" "$APP_ID" "$APP_VERSION_NAME" "$APP_VERSION_CODE" <<'PYEOF'
          import glob, hashlib, os, re, shutil, subprocess, sys

          current_apk, expected_app_id, current_vname, current_vcode_str = sys.argv[1:5]
          current_vcode = int(current_vcode_str)
          expected_label = "A.O.Jarvis"

          def sha256_file(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(65536), b""):
                      h.update(chunk)
              return h.hexdigest()

          def inspect_apk(path):
              badging = subprocess.check_output(["aapt", "dump", "badging", path], text=True, stderr=subprocess.STDOUT)
              pkg_m = re.search(r"package:\s+name='([^']+)'\s+versionCode='(\d+)'\s+versionName='([^']*)'", badging)
              if not pkg_m:
                  return None
              label_m = re.search(r"application-label(?:-[^:]+)?:'([^']+)'", badging)
              label = label_m.group(1) if label_m else ""
              certs = subprocess.check_output(["apksigner", "verify", "--print-certs", path], text=True, stderr=subprocess.STDOUT)
              cert_m = re.search(r"certificate SHA-256 digest:\s*([0-9a-fA-F]+)", certs)
              cert_sha = cert_m.group(1).lower() if cert_m else ""
              return {
                  "pkg": pkg_m.group(1),
                  "vc": int(pkg_m.group(2)),
                  "vn": pkg_m.group(3),
                  "label": label,
                  "cert": cert_sha,
                  "sha256": sha256_file(path),
              }

          cur = inspect_apk(current_apk)
          if not cur or cur["pkg"] != expected_app_id:
              raise SystemExit(f"Erro fatal: APK atual inválido ou applicationId divergente: {cur}")
          print(f"[APK ATUAL] pkg={cur['pkg']} label={cur['label']} v={cur['vn']} (vc={cur['vc']}) cert={cur['cert'][:12]}... sha={cur['sha256'][:12]}")

          kept_by_vc = {}
          for old_path in sorted(glob.glob("existing-apks/*.apk")):
              fname = os.path.basename(old_path)
              if "openjarvis" in fname.lower():
                  print(f"[DESCARTADO - nome antigo no arquivo] {fname}")
                  continue
              try:
                  info = inspect_apk(old_path)
              except Exception as e:
                  print(f"[DESCARTADO - APK corrompido] {fname}: {e}")
                  continue
              if not info:
                  print(f"[DESCARTADO - badging inválido] {fname}")
                  continue
              if info["pkg"] != expected_app_id:
                  print(f"[DESCARTADO - package diferente] {fname} ({info['pkg']})")
                  continue
              if info["label"] != expected_label:
                  print(f"[DESCARTADO - rótulo/ícone legado '{info['label']}'] {fname}")
                  continue
              if not info["cert"] or info["cert"] != cur["cert"]:
                  print(f"[DESCARTADO - assinatura incompatível] {fname} ({info['cert'][:12]} != {cur['cert'][:12]})")
                  continue
              if info["vc"] <= 0 or info["vc"] >= current_vcode:
                  print(f"[DESCARTADO - substituído pela versão atual vc={current_vcode}] {fname} (vc={info['vc']})")
                  continue
              if info["vc"] in kept_by_vc:
                  print(f"[DESCARTADO - versionCode duplicado vc={info['vc']}] {fname}")
                  continue
              kept_by_vc[info["vc"]] = (old_path, info)

          for vc in sorted(kept_by_vc.keys()):
              src_path, info = kept_by_vc[vc]
              safe_vn = re.sub(r"[^0-9A-Za-z._-]", "", info["vn"]) or str(vc)
              out_name = f"A.O.Jarvis-{safe_vn}-vc{vc}-{info['sha256'][:8]}.apk"
              shutil.copy2(src_path, os.path.join("repo", out_name))
              print(f"[MANTIDO NO HISTÓRICO] {out_name} (vc={vc})")

          safe_cur_vn = re.sub(r"[^0-9A-Za-z._-]", "", cur["vn"]) or str(cur["vc"])
          cur_out_name = f"A.O.Jarvis-{safe_cur_vn}-vc{cur['vc']}-{cur['sha256'][:8]}.apk"
          shutil.copy2(current_apk, os.path.join("repo", cur_out_name))
          print(f"[PUBLICADO ATUAL] {cur_out_name} (vc={cur['vc']})")
          PYEOF

          rm -rf existing-apks

          # Ícone oficial final (Tron Data Disc 512x512) no repositório e nos metadados Fastlane
          OFFICIAL_ICON="$GITHUB_WORKSPACE/app/src/main/res/drawable/tron_data_disc_transparent.png"
          if [ ! -f "$OFFICIAL_ICON" ]; then
            OFFICIAL_ICON="$GITHUB_WORKSPACE/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"
          fi
          cp "$OFFICIAL_ICON" repo-icon.png

          mkdir -p "metadata/${APP_ID}/pt-BR/images" "metadata/${APP_ID}/en-US/images"
          if [ -d "$GITHUB_WORKSPACE/fastlane/metadata/android" ]; then
            cp -r "$GITHUB_WORKSPACE/fastlane/metadata/android/"* "metadata/${APP_ID}/"
          fi
          cp "$OFFICIAL_ICON" "metadata/${APP_ID}/pt-BR/images/icon.png"
          cp "$OFFICIAL_ICON" "metadata/${APP_ID}/en-US/images/icon.png"

          # Metadados explícitos do app para garantir nome oficial, versão sugerida atual e zero vestígios antigos
          cat > "metadata/${APP_ID}.yml" <<EOF
          Categories:
            - System
            - Internet
          License: Apache-2.0
          AuthorName: A.O.Jarvis
          Name: A.O.Jarvis
          SourceCode: https://github.com/${GITHUB_REPOSITORY}
          IssueTracker: https://github.com/${GITHUB_REPOSITORY}/issues
          AutoUpdateMode: None
          UpdateCheckMode: None
          CurrentVersion: "${APP_VERSION_NAME}"
          CurrentVersionCode: ${APP_VERSION_CODE}
          EOF

          # Prepara o keystore PKCS12 estável do índice F-Droid:
          # 1) Secrets FDROID_KEYSTORE_BASE64 + FDROID_KEYSTORE_PASS (permanente)
          # 2) Cache persistente do GitHub Actions (.fdroid-repo-keystore/keystore.p12)
          # 3) Gera uma única vez e grava no cache para manter o mesmo fingerprint SHA-256
          KEYSTORE_SOURCE="generated"
          if [ -n "$FDROID_KEYSTORE_BASE64" ] && [ -n "$FDROID_KEYSTORE_PASS" ]; then
            echo "$FDROID_KEYSTORE_BASE64" | base64 -d > keystore.p12
            KS_PASS="$FDROID_KEYSTORE_PASS"
            KEY_PASS="${FDROID_KEY_PASS:-$FDROID_KEYSTORE_PASS}"
            KEY_ALIAS=$(keytool -list -keystore keystore.p12 -storepass "$KS_PASS" 2>/dev/null | awk -F',' '/PrivateKeyEntry/ {print $1; exit}' || true)
            KEY_ALIAS="${KEY_ALIAS:-aojarvis-fdroid}"
            KEYSTORE_SOURCE="secret"
          else
            KS_PASS="aojarvis_fdroid_stable_pass"
            KEY_PASS="aojarvis_fdroid_stable_pass"
            KEY_ALIAS="aojarvis-fdroid"
            mkdir -p "$GITHUB_WORKSPACE/.fdroid-repo-keystore"
            if [ -f "$GITHUB_WORKSPACE/.fdroid-repo-keystore/keystore.p12" ]; then
              cp "$GITHUB_WORKSPACE/.fdroid-repo-keystore/keystore.p12" keystore.p12
              KEY_ALIAS=$(keytool -list -keystore keystore.p12 -storepass "$KS_PASS" 2>/dev/null | awk -F',' '/PrivateKeyEntry/ {print $1; exit}' || echo "aojarvis-fdroid")
              KEYSTORE_SOURCE="actions-cache"
            else
              keytool -genkeypair -noprompt \
                -keystore keystore.p12 \
                -storetype PKCS12 \
                -storepass "$KS_PASS" \
                -alias "$KEY_ALIAS" \
                -keypass "$KEY_PASS" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=A.O.Jarvis F-Droid Repo,O=A.O.Jarvis,C=BR"
              cp keystore.p12 "$GITHUB_WORKSPACE/.fdroid-repo-keystore/keystore.p12"
              KEYSTORE_SOURCE="generated-and-cached"
            fi
          fi
          chmod 600 keystore.p12

          # Extrai o SHA-256 fingerprint do certificado do repositório F-Droid
          FINGERPRINT=$(keytool -list -v -keystore keystore.p12 -storepass "$KS_PASS" -alias "$KEY_ALIAS" \
            | grep -i "SHA256:" | head -n 1 | sed 's/.*SHA256:[[:space:]]*//; s/://g' | tr '[:lower:]' '[:upper:]')

          # Configuração limpa sem mirrors quebrados (evita 404 / Hash not matching)
          cat > config.yml <<EOF
          repo_url: "${RAW_REPO_URL}"
          repo_name: "A.O.Jarvis"
          repo_description: "Repositório F-Droid oficial do aplicativo A.O.Jarvis Android (${GITHUB_REPOSITORY})."
          repo_icon: "repo-icon.png"
          keystore: "keystore.p12"
          keystorepass: "${KS_PASS}"
          repo_keyalias: "${KEY_ALIAS}"
          keypass: "${KEY_PASS}"
          repo_maxage: 0
          archive_older: 0
          EOF
          chmod 600 config.yml

          # Remove ícones em cache antigos antes de gerar o índice limpo
          rm -rf repo/icons repo/icons-*

          fdroid update --clean --create-metadata --use-date-from-apk

          # Validação estrita de integridade: impede publicar índice vazio, duplicado ou com SHA-256 divergente
          if [ ! -s repo/index-v1.jar ] && [ ! -s repo/entry.jar ]; then
            echo "Erro fatal: nenhum índice F-Droid (index-v1.jar ou entry.jar) foi gerado!"
            ls -la repo/
            exit 1
          fi

          python3 - "$APP_ID" "$APP_VERSION_CODE" <<'PYEOF'
          import hashlib, json, os, sys, zipfile

          app_id = sys.argv[1]
          expected_vc = int(sys.argv[2])

          def sha256_file(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(65536), b""):
                      h.update(chunk)
              return h.hexdigest()

          found_vcs = []

          if os.path.exists("repo/index-v2.json"):
              with open("repo/index-v2.json", "r", encoding="utf-8") as f:
                  idx2 = json.load(f)
              pkg = idx2.get("packages", {}).get(app_id)
              if not pkg:
                  raise SystemExit(f"Erro fatal: {app_id} ausente em repo/index-v2.json")
              versions = pkg.get("versions", {})
              if not versions:
                  raise SystemExit("Erro fatal: nenhuma versão encontrada em repo/index-v2.json")
              for vid, vdata in versions.items():
                  file_info = vdata["file"]
                  rel_name = file_info["name"].lstrip("/")
                  disk_path = os.path.join("repo", rel_name)
                  if not os.path.isfile(disk_path):
                      raise SystemExit(f"Erro fatal: APK listado no índice não existe em disco: {disk_path}")
                  actual_sha = sha256_file(disk_path)
                  if actual_sha != file_info["sha256"]:
                      raise SystemExit(f"Erro fatal: SHA-256 divergente para {rel_name}: {actual_sha} != {file_info['sha256']}")
                  vc = int(vdata["manifest"]["versionCode"])
                  vn = vdata["manifest"].get("versionName", "")
                  found_vcs.append((vc, vn, rel_name, actual_sha))
                  print(f"[INDEX-V2 OK] v{vn} (vc={vc}) -> {rel_name} sha256={actual_sha[:16]}...")

              if os.path.exists("repo/entry.jar"):
                  with zipfile.ZipFile("repo/entry.jar", "r") as zf:
                      entry = json.loads(zf.read("entry.json").decode("utf-8"))
                  idx_meta = entry.get("index", {})
                  actual_idx_sha = sha256_file("repo/index-v2.json")
                  if idx_meta.get("sha256") != actual_idx_sha:
                      raise SystemExit(f"Erro fatal: entry.jar aponta para SHA-256 divergente de index-v2.json!")
                  print(f"[ENTRY.JAR OK] index-v2.json sha256={actual_idx_sha[:16]}...")

          elif os.path.exists("repo/index-v1.jar"):
              with zipfile.ZipFile("repo/index-v1.jar", "r") as zf:
                  idx1 = json.loads(zf.read("index-v1.json").decode("utf-8"))
              pkgs = idx1.get("packages", {}).get(app_id, [])
              if not pkgs:
                  raise SystemExit(f"Erro fatal: {app_id} ausente em index-v1.json")
              for item in pkgs:
                  rel_name = item["apkName"]
                  disk_path = os.path.join("repo", rel_name)
                  if not os.path.isfile(disk_path):
                      raise SystemExit(f"Erro fatal: APK listado no index-v1 não existe: {disk_path}")
                  actual_sha = sha256_file(disk_path)
                  if actual_sha != item["hash"]:
                      raise SystemExit(f"Erro fatal: SHA-256 divergente para {rel_name}")
                  vc = int(item["versionCode"])
                  vn = item.get("versionName", "")
                  found_vcs.append((vc, vn, rel_name, actual_sha))
                  print(f"[INDEX-V1 OK] v{vn} (vc={vc}) -> {rel_name} sha256={actual_sha[:16]}...")

          vc_list = [x[0] for x in found_vcs]
          if len(vc_list) != len(set(vc_list)):
              raise SystemExit(f"Erro fatal: versionCodes duplicados detectados no índice: {vc_list}")
          if expected_vc not in vc_list:
              raise SystemExit(f"Erro fatal: versionCode atual ({expected_vc}) não está no índice gerado: {vc_list}")

          print(f"[INTEGRIDADE F-DROID VALIDADA] {len(found_vcs)} versão(ões) íntegra(s): {sorted(vc_list)}")
          PYEOF

          echo "Arquivos gerados em fdroid/repo:"
          ls -lh repo/

          # Remove arquivos secretos e temporários antes do deploy para gh-pages
          rm -f keystore.p12 config.yml repo-icon.png
          touch "$GITHUB_WORKSPACE/fdroid-site/.nojekyll"

          # Página inicial para abrir direto no F-Droid com o fingerprint correto
          FDROID_RAW_LINK="fdroidrepos://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/fdroid/repo?fingerprint=${FINGERPRINT}"
          FDROID_PAGES_LINK="fdroidrepos://${REPO_OWNER_LOWER}.github.io/${REPO_NAME}/fdroid/repo?fingerprint=${FINGERPRINT}"

          cat > "$GITHUB_WORKSPACE/fdroid-site/index.html" <<EOF
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>A.O.Jarvis — Repositório F-Droid</title>
            <style>
              body { font-family: system-ui, sans-serif; background: #0B1117; color: #E6EDF3; padding: 32px; max-width: 720px; margin: auto; }
              a.btn { display: inline-block; background: #00E5FF; color: #052026; font-weight: 700; padding: 12px 20px; border-radius: 10px; text-decoration: none; margin: 8px 8px 0 0; }
              code { display: block; background: #161F29; padding: 10px 12px; border-radius: 8px; word-break: break-all; margin: 8px 0; }
            </style>
          </head>
          <body>
            <h1>A.O.Jarvis — Repositório F-Droid</h1>
            <p>Versão atual publicada: <strong>v${APP_VERSION_NAME} (build ${APP_VERSION_CODE})</strong></p>
            <h3>URL Recomendada — GitHub Raw (sempre atualizada)</h3>
            <code>${RAW_REPO_URL}</code>
            <a class="btn" href="${FDROID_RAW_LINK}">Abrir no F-Droid (Raw)</a>
            <h3>Opção Alternativa — GitHub Pages</h3>
            <code>${PAGES_REPO_URL}</code>
            <a class="btn" href="${FDROID_PAGES_LINK}">Abrir no F-Droid (Pages)</a>
            <h3>Fingerprint SHA-256</h3>
            <code>${FINGERPRINT}</code>
          </body>
          </html>
          EOF

          {
            echo "## Repositório F-Droid Publicado — A.O.Jarvis v${APP_VERSION_NAME} (build ${APP_VERSION_CODE})"
            echo "- **URL Oficial (GitHub Raw):** \`${RAW_REPO_URL}\`"
            echo "- **URL GitHub Pages:** \`${PAGES_REPO_URL}\`"
            echo "- **Fingerprint SHA-256:** \`${FINGERPRINT}\`"
            echo "- **Origem da chave F-Droid:** \`${KEYSTORE_SOURCE}\`"
            if [ "$KEYSTORE_SOURCE" != "secret" ]; then
              echo "> **Dica:** A chave do repositório foi persistida no cache do GitHub Actions. Para garantia permanente mesmo após 7 dias sem commits, configure os secrets \`FDROID_KEYSTORE_BASE64\` e \`FDROID_KEYSTORE_PASS\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar repositório F-Droid no branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./fdroid-site
          publish_branch: gh-pages
          force_orphan: true
