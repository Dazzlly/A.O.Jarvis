name: Build APK, GitHub Release & F-Droid Repo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag da versão (ex: v1.0.1)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release-and-fdroid:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Preparar keystore e compilar APK
        id: build_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Compilando APK de Release assinado..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/my-upload-key.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/my-upload-key.jks"
            gradle :app:assembleRelease --no-daemon
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            echo "build_type=release" >> "$GITHUB_OUTPUT"
          else
            echo "Secrets de Release não configurados; compilando APK debug..."
            if [ ! -f debug.keystore ]; then
              keytool -genkey -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            gradle :app:assembleDebug --no-daemon
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Erro: APK não encontrado após o build."
            exit 1
          fi

          TAG_NAME="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          fi

          CLEAN_TAG="${TAG_NAME#v}"
          FINAL_APK="OpenJarvis-${CLEAN_TAG}.apk"
          cp "$APK_PATH" "$FINAL_APK"
          echo "apk_file=$FINAL_APK" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Publicar GitHub Release com APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build_apk.outputs.tag_name }}
          name: "OpenJarvis ${{ steps.build_apk.outputs.tag_name }}"
          generate_release_notes: true
          files: |
            ${{ steps.build_apk.outputs.apk_file }}

      - name: Gerar repositório estático F-Droid
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEY_PASS }}
          APK_FILE: ${{ steps.build_apk.outputs.apk_file }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fdroidserver apksigner

          REPO_OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          REPO_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}/fdroid/repo"

          mkdir -p fdroid-site/fdroid
          cd fdroid-site/fdroid

          # Restaura o histórico existente do gh-pages (se já publicado) para manter versões anteriores
          if git ls-remote --exit-code --heads "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" existing-pages
            if [ -d existing-pages/fdroid/repo ]; then
              cp -r existing-pages/fdroid/repo ./repo
            fi
            rm -rf existing-pages
          fi

          mkdir -p repo metadata
          cp "$GITHUB_WORKSPACE/$APK_FILE" repo/

          # Copia metadados Fastlane se existirem
          if [ -d "$GITHUB_WORKSPACE/fastlane/metadata/android" ]; then
            cp -r "$GITHUB_WORKSPACE/fastlane/metadata/android" metadata/
          fi

          cat > config.yml <<EOF
          repo_url: "${REPO_URL}"
          repo_name: "OpenJarvis Repo"
          repo_description: "Repositório F-Droid oficial do projeto OpenJarvis Android (${GITHUB_REPOSITORY})."
          repo_maxage: 0
          archive_older: 0
          EOF

          if [ -n "$FDROID_KEYSTORE_BASE64" ] && [ -n "$FDROID_KEYSTORE_PASS" ]; then
            echo "$FDROID_KEYSTORE_BASE64" | base64 -d > keystore.p12
            cat >> config.yml <<EOF
          keystore: keystore.p12
          keystorepass: "${FDROID_KEYSTORE_PASS}"
          repo_keyalias: "openjarvis-fdroid"
          keypass: "${FDROID_KEY_PASS:-$FDROID_KEYSTORE_PASS}"
          EOF
          else
            fdroid init --no-prompt
          fi

          fdroid update --create-metadata --pretty --use-date-from-apk
          rm -f keystore.p12 config.yml

          # Página índice simples para facilitar a adição no F-Droid
          cat > "$GITHUB_WORKSPACE/fdroid-site/index.html" <<EOF
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>OpenJarvis — Repositório F-Droid</title>
            <style>
              body { font-family: system-ui, sans-serif; background: #0B1117; color: #E6EDF3; padding: 32px; max-width: 680px; margin: auto; }
              a.btn { display: inline-block; background: #26C6DA; color: #052026; font-weight: 700; padding: 12px 20px; border-radius: 10px; text-decoration: none; margin-top: 12px; }
              code { background: #161F29; padding: 4px 8px; border-radius: 6px; word-break: break-all; }
            </style>
          </head>
          <body>
            <h1>OpenJarvis — Repositório F-Droid</h1>
            <p>Adicione este endereço no aplicativo F-Droid para receber atualizações automáticas do OpenJarvis:</p>
            <p><code>${REPO_URL}</code></p>
            <a class="btn" href="fdroidrepos://${REPO_OWNER}.github.io/${REPO_NAME}/fdroid/repo">Abrir no F-Droid</a>
          </body>
          </html>
          EOF

      - name: Publicar repositório F-Droid no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./fdroid-site
          publish_branch: gh-pages
          keep_files: true
